# Codemagic（クラウドの macOS）でのビルド設定。Codemagic はリポジトリ直下の codemagic.yaml を読む。
# 前提: Codemagic のアプリ設定 → Environment variables で、グループ "appstore" に次の 3 つを入れてあること
#   APP_STORE_CONNECT_ISSUER_ID      … Issuer ID
#   APP_STORE_CONNECT_KEY_IDENTIFIER … Key ID
#   APP_STORE_CONNECT_PRIVATE_KEY    … .p8 の中身をそのまま（Secure にする）
# 控えは kokuteki-private/appstore/api-key-info.txt。この名前のままにすると、
# app-store-connect コマンドと publishing が自動で読む（Integrations の画面を触らなくてよい）
workflows:
  ios-appstore:
    name: TENRYU iOS（App Store）
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      groups:
        - appstore
      vars:
        BUNDLE_ID: "com.amaterasuvocab.kokuteki"
        XCODE_SCHEME: "App"
      node: 20
      xcode: latest
      cocoapods: default
    scripts:
      - name: 依存を入れる
        script: |
          cd mobile
          npm install
      - name: 配信ファイルを www に集める（three.js と 3D モデルも同梱）
        script: |
          cd mobile
          node copy-web.js
      - name: iOS プロジェクトを作る
        script: |
          cd mobile
          npx cap add ios || true
          npx cap sync ios
      - name: アイコンと起動画面を作る
        script: |
          cd mobile
          npx capacitor-assets generate --ios --assetPath assets
      - name: Info.plist を直す（向き・輸出コンプライアンス・表示名）
        script: |
          cd mobile
          node patch-ios.js
      - name: ビルド番号を入れる（Codemagic の通し番号を使う）
        script: |
          cd mobile/ios/App
          agvtool new-version -all "${BUILD_NUMBER:-1}"
      - name: 署名の設定
        script: |
          keychain initialize
          app-store-connect fetch-signing-files "$BUNDLE_ID" --type IOS_APP_STORE --create
          keychain add-certificates
          xcode-project use-profiles
      - name: ビルド
        script: |
          cd mobile/ios/App
          xcode-project build-ipa --workspace "App.xcworkspace" --scheme "$XCODE_SCHEME"
    artifacts:
      - mobile/ios/App/build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        api_key: $APP_STORE_CONNECT_PRIVATE_KEY
        key_id: $APP_STORE_CONNECT_KEY_IDENTIFIER
        issuer_id: $APP_STORE_CONNECT_ISSUER_ID
        submit_to_testflight: true
        submit_to_app_store: false     # 動作確認が済んだら true にする
