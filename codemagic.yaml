# Codemagic（クラウドの macOS）でのビルド設定。Codemagic はリポジトリ直下の codemagic.yaml を読む。
# 前提: Codemagic の Teams → Integrations → App Store Connect に、名前 "TENRYU" でキーを登録してあること
#       （Key ID / Issuer ID / .p8 は kokuteki-private/appstore/ に控え）
workflows:
  ios-appstore:
    name: TENRYU iOS（App Store）
    instance_type: mac_mini_m2
    max_build_duration: 60
    integrations:
      app_store_connect: TENRYU        # ← Codemagic で付けた連携の名前と一致させる
    environment:
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.amaterasuvocab.kokuteki
      vars:
        BUNDLE_ID: "com.amaterasuvocab.kokuteki"
        XCODE_SCHEME: "App"
      node: 20
      xcode: latest
      cocoapods: default
    scripts:
      - name: 依存を入れる
        script: |
          cd mobile
          npm install
      - name: 配信ファイルを www に集める（three.js と 3D モデルも同梱）
        script: |
          cd mobile
          node copy-web.js
      - name: iOS プロジェクトを作る
        script: |
          cd mobile
          npx cap add ios || true
          npx cap sync ios
      - name: アイコンと起動画面を作る
        script: |
          cd mobile
          npx capacitor-assets generate --ios --assetPath assets
      - name: Info.plist を直す（向き・輸出コンプライアンス・表示名）
        script: |
          cd mobile
          node patch-ios.js
      - name: ビルド番号を入れる（Codemagic の通し番号を使う）
        script: |
          cd mobile/ios/App
          agvtool new-version -all "${BUILD_NUMBER:-1}"
      - name: 署名の設定
        script: |
          keychain initialize
          app-store-connect fetch-signing-files "$BUNDLE_ID" --type IOS_APP_STORE --create
          keychain add-certificates
          xcode-project use-profiles
      - name: ビルド
        script: |
          cd mobile/ios/App
          xcode-project build-ipa --workspace "App.xcworkspace" --scheme "$XCODE_SCHEME"
    artifacts:
      - mobile/ios/App/build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        submit_to_app_store: false     # 動作確認が済んだら true にする
