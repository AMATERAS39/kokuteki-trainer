# Codemagic（クラウドの macOS）でのビルド設定。Codemagic はリポジトリ直下の codemagic.yaml を読む。
# 前提: Codemagic のアプリ設定 → Environment variables で、グループ "appstore" に次の 3 つを入れてあること
#   APP_STORE_CONNECT_ISSUER_ID      … Issuer ID
#   APP_STORE_CONNECT_KEY_IDENTIFIER … Key ID
#   APP_STORE_CONNECT_PRIVATE_KEY    … .p8 の中身をそのまま（Secure にする）
#   CERTIFICATE_PRIVATE_KEY          … 配布証明書を作るための RSA 秘密鍵（Secure にする）
#                                      これが無いと「Cannot save Signing Certificates without certificate private key」で落ちる
# 控えは kokuteki-private/appstore/api-key-info.txt。この名前のままにすると、
# app-store-connect コマンドと publishing が自動で読む（Integrations の画面を触らなくてよい）
workflows:
  ios-appstore:
    name: TENRYU iOS（App Store）
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      groups:
        - appstore
      vars:
        BUNDLE_ID: "com.amaterasuvocab.kokuteki"
        XCODE_SCHEME: "App"
      node: 20
      xcode: latest
      cocoapods: default
    scripts:
      - name: 依存を入れる
        script: |
          cd mobile
          npm install
      - name: 配信ファイルを www に集める（three.js と 3D モデルも同梱）
        script: |
          cd mobile
          node copy-web.js
      - name: iOS プロジェクトを作る
        script: |
          cd mobile
          npx cap add ios || true
          npx cap sync ios
      - name: アイコンと起動画面を作る
        script: |
          cd mobile
          npx capacitor-assets generate --ios --assetPath assets
      - name: Info.plist を直す（向き・輸出コンプライアンス・表示名）
        script: |
          cd mobile
          node patch-ios.js
      - name: ビルド番号を入れる（Codemagic の通し番号を使う）
        script: |
          cd mobile/ios/App
          agvtool new-version -all "${BUILD_NUMBER:-1}" || echo "agvtool で入れられませんでした（既定の番号のまま進みます）"
      - name: 署名の設定
        script: |
          set -e
          keychain initialize
          # --certificate-key を渡すと、配布証明書をこの鍵で作る（次回以降は同じ証明書を使い回せる）
          app-store-connect fetch-signing-files "$BUNDLE_ID" --type IOS_APP_STORE --create --certificate-key @env:CERTIFICATE_PRIVATE_KEY
          keychain add-certificates
          # 割り当て先を明示する（既定の探索だと App に当たらないことがある）
          xcode-project use-profiles --project "mobile/ios/App/App.xcodeproj"
          # 取ってきたプロファイルの UUID とチーム ID を、次の段階へ渡す
          # （プロジェクトへの書き込みが当たらなくても、xcodebuild に直接渡せば署名できる）
          PROF=$(ls -t "$HOME/Library/MobileDevice/Provisioning Profiles/"*.mobileprovision | head -1)
          INFO=$(security cms -D -i "$PROF")
          PROFILE_UUID=$(echo "$INFO" | plutil -extract UUID raw -)
          PROFILE_NAME=$(echo "$INFO" | plutil -extract Name raw -)
          TEAM_ID=$(echo "$INFO" | plutil -extract TeamIdentifier.0 raw -)
          echo "プロファイル: $PROFILE_NAME / UUID: $PROFILE_UUID / チーム: $TEAM_ID"
          echo "PROFILE_UUID=$PROFILE_UUID" >> $CM_ENV
          echo "TEAM_ID=$TEAM_ID" >> $CM_ENV
          # いまの設定を残す（次に落ちたときの手がかり）
          xcodebuild -workspace mobile/ios/App/App.xcworkspace -scheme App -showBuildSettings 2>/dev/null             | grep -E "PRODUCT_BUNDLE_IDENTIFIER|PROVISIONING_PROFILE|CODE_SIGN_IDENTITY|CODE_SIGN_STYLE|DEVELOPMENT_TEAM" | sort -u || true
      - name: ビルド
        script: |
          cd mobile/ios/App
          xcode-project build-ipa --workspace "App.xcworkspace" --scheme "$XCODE_SCHEME"             --archive-flags "DEVELOPMENT_TEAM=$TEAM_ID PROVISIONING_PROFILE_SPECIFIER=$PROFILE_UUID CODE_SIGN_STYLE=Manual"
    artifacts:
      - mobile/ios/App/build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        api_key: $APP_STORE_CONNECT_PRIVATE_KEY
        key_id: $APP_STORE_CONNECT_KEY_IDENTIFIER
        issuer_id: $APP_STORE_CONNECT_ISSUER_ID
        submit_to_testflight: true
        submit_to_app_store: false     # 動作確認が済んだら true にする
