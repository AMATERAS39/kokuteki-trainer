# Codemagic（クラウドの macOS）でのビルド設定。Codemagic はリポジトリ直下の codemagic.yaml を読む。
# 前提: Codemagic のアプリ設定 → Environment variables で、グループ "appstore" に次の 3 つを入れてあること
#   APP_STORE_CONNECT_ISSUER_ID      … Issuer ID
#   APP_STORE_CONNECT_KEY_IDENTIFIER … Key ID
#   APP_STORE_CONNECT_PRIVATE_KEY    … .p8 の中身をそのまま（Secure にする）
#   CERTIFICATE_PRIVATE_KEY          … 配布証明書を作るための RSA 秘密鍵（Secure にする）
#                                      これが無いと「Cannot save Signing Certificates without certificate private key」で落ちる
# 控えは kokuteki-private/appstore/api-key-info.txt。この名前のままにすると、
# app-store-connect コマンドと publishing が自動で読む（Integrations の画面を触らなくてよい）
workflows:
  ios-appstore:
    name: TENRYU iOS（App Store）
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      groups:
        - appstore
      vars:
        BUNDLE_ID: "com.amaterasuvocab.kokuteki"
        XCODE_SCHEME: "App"
      node: 20
      xcode: latest
      cocoapods: default
    scripts:
      - name: 依存を入れる
        script: |
          cd mobile
          npm install
      - name: 配信ファイルを www に集める（three.js と 3D モデルも同梱）
        script: |
          cd mobile
          node copy-web.js
      - name: iOS プロジェクトを作る
        script: |
          cd mobile
          npx cap add ios || true
      - name: 設定を直す（向き・輸出コンプライアンス・表示名・バンドル ID・対応 iOS 15.0）
        script: |
          cd mobile
          node patch-ios.js          # Podfile は pod install より前に直す必要がある
      - name: 部品を入れて同期する
        script: |
          cd mobile
          npx cap sync ios
      - name: アイコンと起動画面を作る
        script: |
          cd mobile
          npx capacitor-assets generate --ios --assetPath assets
      - name: 版とビルド番号を入れる（版はアプリの中の表示と同じにする）
        script: |
          cd mobile/ios/App
          # App Store に出す版は、アプリの中に出している版（index.html の APP_VER）と同じにする。
          # v03.50 → 3.50。Apple は数の並びで比べるので、桁を落とさなければ次の版のほうが大きくなる
          VER=$(node -e "const s=require('fs').readFileSync('../../../index.html','utf8');const m=s.match(/APP_VER='v([0-9.]+)'/);if(!m){process.exit(1)}console.log(m[1].split('.').map(x=>String(parseInt(x,10))).join('.'))") || VER=""
          if [ -n "$VER" ]; then
            echo "App Store に出す版: $VER"
            agvtool new-marketing-version "$VER" || echo "版を入れられませんでした（既定のまま進みます）"
          else
            echo "APP_VER を読めませんでした（版は既定のまま）"
          fi
          agvtool new-version -all "${BUILD_NUMBER:-1}" || echo "agvtool で入れられませんでした（既定の番号のまま進みます）"
      - name: 署名の設定
        script: |
          set -e
          keychain initialize
          # --certificate-key を渡すと、配布証明書をこの鍵で作る（次回以降は同じ証明書を使い回せる）
          app-store-connect fetch-signing-files "$BUNDLE_ID" --type IOS_APP_STORE --create --certificate-key @env:CERTIFICATE_PRIVATE_KEY
          keychain add-certificates
          # 割り当て先を明示する（既定の探索だと App に当たらないことがある）
          xcode-project use-profiles --project "mobile/ios/App/App.xcodeproj"
          # いまの設定を残す（次に落ちたときの手がかり）
          xcodebuild -workspace mobile/ios/App/App.xcworkspace -scheme App -showBuildSettings 2>/dev/null             | grep -E "PRODUCT_BUNDLE_IDENTIFIER|PROVISIONING_PROFILE|CODE_SIGN_IDENTITY|CODE_SIGN_STYLE|DEVELOPMENT_TEAM" | sort -u || true
      - name: ビルド
        script: |
          cd mobile/ios/App
          xcode-project build-ipa --workspace "App.xcworkspace" --scheme "$XCODE_SCHEME"
    artifacts:
      - mobile/ios/App/build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        api_key: $APP_STORE_CONNECT_PRIVATE_KEY
        key_id: $APP_STORE_CONNECT_KEY_IDENTIFIER
        issuer_id: $APP_STORE_CONNECT_ISSUER_ID
        submit_to_testflight: true
        submit_to_app_store: false     # 動作確認が済んだら true にする
