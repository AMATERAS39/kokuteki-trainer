<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>T-4 14方向レンダラー</title>
<style>body{margin:0;background:#888;font:12px monospace;color:#fff}#log{position:fixed;left:8px;top:8px;white-space:pre}</style>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"}}</script>
</head>
<body>
<canvas id="c"></canvas>
<div id="log"></div>
<script type="module">
import * as THREE from 'three';
import { FBXLoader } from 'three/addons/loaders/FBXLoader.js';
const log = m => { document.getElementById('log').textContent += m + '\n'; };
const P = new URLSearchParams(location.search);
const D = Math.PI / 180;
const W = +(P.get('w') || 1200), H = +(P.get('h') || 800);
const canvas = document.getElementById('c');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true, preserveDrawingBuffer: true });
renderer.setSize(W, H); renderer.setPixelRatio(1);
renderer.setClearColor(0x000000, P.has('probe') && !P.has('save') ? 1 : 0);
renderer.outputColorSpace = THREE.SRGBColorSpace;
const scene = new THREE.Scene();
/* 照明: 環境光を主体にして、陰影が濃く出ないようにする（?hemi= ?dir= で調整） */
scene.add(new THREE.HemisphereLight(0xffffff, 0xb0b8c4, +(P.get('hemi') || 2.2)));
scene.add(new THREE.AmbientLight(0xffffff, +(P.get('amb') || 0.6)));
const dl = new THREE.DirectionalLight(0xffffff, +(P.get('dir') || 0.9)); dl.position.set(-3, -4, 6); scene.add(dl);
const dl2 = new THREE.DirectionalLight(0xffffff, +(P.get('dir2') || 0.4)); dl2.position.set(4, -2, -3); scene.add(dl2);
/* 世界座標: x=東(右), y=北(奥), z=上。視点は南 (0,-d,0) から原点を見る */
const cam = new THREE.PerspectiveCamera(+(P.get('fov') || 28), W / H, 0.1, 1000);
cam.up.set(0, 0, 1);
const elev = +(P.get('elev') || 0);           // 視点の仰角 [°]（0 = 真横）
const dist = +(P.get('dist') || 36);
cam.position.set(0, -dist * Math.cos(elev * D), dist * Math.sin(elev * D)); cam.lookAt(0, 0, 0);

/* テクスチャまで含めて読み込みが終わるのを待つ */
const manager = new THREE.LoadingManager();
const loader = new FBXLoader(manager); loader.setResourcePath('/t4model/');
let obj;
try {
  obj = await new Promise((res, rej) => { let o; manager.onLoad = () => res(o); manager.onError = u => log('missing ' + u); loader.load('/t4model/T4blue.fbx', x => { o = x; }, undefined, rej); });
} catch (e) { log('load error: ' + e.message); throw e; }
let meshes = 0, textured = 0;
obj.traverse(o => { if (o.isMesh) { meshes++; const ms = Array.isArray(o.material) ? o.material : [o.material]; ms.forEach(m => {
  if (m.map) { textured++; m.color.setRGB(1, 1, 1); if (m.map.colorSpace !== undefined) m.map.colorSpace = THREE.SRGBColorSpace; }
  if (m.emissive) m.emissive.setRGB(0, 0, 0); if (m.specular) m.specular.setRGB(.05, .05, .05); m.shininess = 8;
  m.side = P.get('side') === 'front' ? THREE.FrontSide : THREE.DoubleSide; m.needsUpdate = true; }); } });
/* 法線を形状から計算し直す（元データの法線が内向きの面が黒く描かれるのを防ぐ）。?fixnormals=0 で無効 */
if (P.get('fixnormals') !== '0') obj.traverse(o => { if (o.isMesh && o.geometry) { o.geometry.deleteAttribute('normal'); o.geometry.computeVertexNormals(); } });
const box = new THREE.Box3().setFromObject(obj); const size = box.getSize(new THREE.Vector3()); const ctr = box.getCenter(new THREE.Vector3());
const names = []; obj.traverse(o => { if (o.isMesh) names.push(o.name + '[' + (Array.isArray(o.material) ? o.material.map(m => m.name).join('|') : o.material.name) + ']'); });
log(`meshes ${meshes} textured ${textured} size ${size.x.toFixed(1)} ${size.y.toFixed(1)} ${size.z.toFixed(1)}\n` + names.join('\n'));
/* 特定メッシュの特定材質を単色に置き換える（?paint=mesh/material/rrggbb,...）。脚収納部の内側を機体色で塗るのに使う */
for (const spec of (P.get('paint') || '').split(',').filter(Boolean)) {
  const [mesh, mat, hex] = spec.split('/');
  obj.traverse(o => { if (o.isMesh && o.name === mesh) { const ms = Array.isArray(o.material) ? o.material : [o.material];
    ms.forEach(m => { if (m.name === mat || (mat === '_' && !m.name)) { m.map = null; m.color.setHex(parseInt(hex, 16)); m.needsUpdate = true; log('paint ' + mesh + '/' + mat); } }); } });
}
/* テクスチャ差し替え（?tex=material:file,...）。UV の対応を調べる用 */
for (const spec of (P.get('tex') || '').split(',').filter(Boolean)) {
  const [mat, file] = spec.split(':'); const t = await new THREE.TextureLoader().loadAsync('/t4model/' + file); t.colorSpace = THREE.SRGBColorSpace; t.flipY = false;
  obj.traverse(o => { if (o.isMesh) { const ms = Array.isArray(o.material) ? o.material : [o.material]; ms.forEach(m => { if (m.name === mat && m.map) { t.wrapS = m.map.wrapS; t.wrapT = m.map.wrapT; t.flipY = m.map.flipY; m.map = t; m.needsUpdate = true; } }); } });
  log('tex ' + mat + ' <- ' + file);
}
/* 材質の付け替え（?remap=mesh:from>to）。from 材質の面に、to 材質の面から推定した平面写像で UV を与え、to 材質を割り当てる。
   脚収納部の板（無地の main）に機体下面テクスチャ（bot）を隣と連続するように貼るのに使う */
for (const spec of (P.get('remap') || '').split(',').filter(Boolean)) {
  const [mesh, pair] = spec.split(':'); const [from, to] = pair.split('>');
  obj.traverse(o => {
    if (!o.isMesh || o.name !== mesh) return;
    const ms = Array.isArray(o.material) ? o.material : [o.material];
    const fi = ms.findIndex(m => m.name === from), ti = ms.findIndex(m => m.name === to);
    const g = o.geometry, pos = g.attributes.position, uv = g.attributes.uv;
    if (fi < 0 || ti < 0 || !uv || g.index) { log('remap skipped ' + spec); return; }
    /* to 材質の頂点で u,v = a·x + b·y + c·z + d を最小二乗で当てはめる（4×4 正規方程式） */
    const A = Array.from({ length: 4 }, () => [0, 0, 0, 0]), bu = [0, 0, 0, 0], bv = [0, 0, 0, 0];
    for (const gr of g.groups) { if (gr.materialIndex !== ti) continue;
      for (let i = gr.start; i < gr.start + gr.count; i++) { const r = [pos.getX(i), pos.getY(i), pos.getZ(i), 1];
        for (let a = 0; a < 4; a++) { bu[a] += r[a] * uv.getX(i); bv[a] += r[a] * uv.getY(i); for (let b = 0; b < 4; b++) A[a][b] += r[a] * r[b]; } } }
    const solve = (M, y) => { const n = 4, m = M.map((row, i) => [...row, y[i]]);
      for (let c = 0; c < n; c++) { let p = c; for (let r = c + 1; r < n; r++) if (Math.abs(m[r][c]) > Math.abs(m[p][c])) p = r; [m[c], m[p]] = [m[p], m[c]];
        for (let r = 0; r < n; r++) { if (r === c || Math.abs(m[c][c]) < 1e-12) continue; const f = m[r][c] / m[c][c]; for (let k = c; k <= n; k++) m[r][k] -= f * m[c][k]; } }
      return m.map((row, i) => Math.abs(row[i]) < 1e-12 ? 0 : row[n] / row[i]); };
    const cu = solve(A, bu), cv = solve(A, bv);
    let n = 0;
    for (const gr of g.groups) { if (gr.materialIndex !== fi) continue; gr.materialIndex = ti;
      for (let i = gr.start; i < gr.start + gr.count; i++) { const x = pos.getX(i), y = pos.getY(i), z = pos.getZ(i);
        uv.setXY(i, cu[0] * x + cu[1] * y + cu[2] * z + cu[3], cv[0] * x + cv[1] * y + cv[2] * z + cv[3]); n++; } }
    uv.needsUpdate = true;
    let mn = [1e9, 1e9], mx = [-1e9, -1e9];
    for (const gr of g.groups) { if (gr.materialIndex !== ti) continue; for (let i = gr.start; i < gr.start + gr.count; i++) { const u = uv.getX(i), v = uv.getY(i); mn = [Math.min(mn[0], u), Math.min(mn[1], v)]; mx = [Math.max(mx[0], u), Math.max(mx[1], v)]; } }
    const tm = ms[ti];
    log(`remap ${mesh}: ${from} -> ${to} (${n} verts) cu=${cu.map(v => v.toFixed(4))} cv=${cv.map(v => v.toFixed(4))} uv[${mn.map(v=>v.toFixed(2))}..${mx.map(v=>v.toFixed(2))}] map=${tm.map && tm.map.image && (tm.map.image.currentSrc || tm.map.image.src || '?').split('/').pop()} wrap=${tm.map && tm.map.wrapS} vc=${tm.vertexColors} color=${tm.color.getHexString()} groups=${g.groups.length}`);
  });
}
/* 脚など飛行中に見えない部品を非表示にする（名前で指定: ?hide=a,b,c） */
const hide = (P.get('hide') || '').split(',').filter(Boolean);
obj.traverse(o => { if (o.isMesh && hide.some(h => o.name.toLowerCase().includes(h.toLowerCase()))) o.visible = false; });
const inner = new THREE.Group(); inner.add(obj); obj.position.sub(ctr);
inner.scale.setScalar(10 / Math.max(size.x, size.y, size.z));
/* モデル固有の軸を標準状態（機首 +y, 機体上部 +z）に合わせる回転（度）。試し描画で決める */
inner.rotation.set(+(P.get('ax') || 0) * D, +(P.get('ay') || 0) * D, +(P.get('az') || 0) * D, P.get('order') || 'XYZ');
const pivot = new THREE.Group(); pivot.add(inner); scene.add(pivot);
if (P.has('probe') && !P.has('save')) { scene.add(new THREE.AxesHelper(9)); const g = new THREE.GridHelper(20, 20, 0x444444, 0x666666); g.rotation.x = Math.PI / 2; scene.add(g); }

/* 方位 h（北0°時計回り）とピッチ p（機首上げ正）へ。標準状態から Rx(p) → Rz(-h) */
function setDir(h, p, bank = 0) {
  /* bank: 右バンク正。機体前後軸（+y）回りの回転を最後に掛ける */
  const m = new THREE.Matrix4().makeRotationZ(-h * D).multiply(new THREE.Matrix4().makeRotationX(p * D)).multiply(new THREE.Matrix4().makeRotationY(bank * D));
  pivot.quaternion.setFromRotationMatrix(m);
}
/* 斜め方向のピッチ角 [°]（?dp= で指定。既定 30。方位の 45° は固定） */
const DP = +(P.get('dp') || 30);
const DIRS = [
  ['north', 0, 0], ['south', 180, 0], ['east', 90, 0], ['west', 270, 0], ['up', 0, 90], ['down', 0, -90],
  ['ne_up', 45, DP], ['nw_up', 315, DP], ['se_up', 135, DP], ['sw_up', 225, DP],
  ['ne_down', 45, -DP], ['nw_down', 315, -DP], ['se_down', 135, -DP], ['sw_down', 225, -DP]
];
async function save(name) {
  const data = canvas.toDataURL('image/png');
  const r = await fetch('/save?name=bi-' + name, { method: 'POST', body: data });
  log(name + ': ' + (await r.text()));
}
if (P.has('export')) {
  /* アプリの 3D ビューア用に GLB を書き出す。非表示メッシュは取り除き、テクスチャは縮小して埋め込む */
  const { GLTFExporter } = await import('three/addons/exporters/GLTFExporter.js');
  const dead = []; obj.traverse(o => { if (o.isMesh && !o.visible) dead.push(o); }); dead.forEach(o => o.parent.remove(o));
  /* 頂点の共有化とグループ統合で容量を減らす（FBX は面ごとに頂点が重複している） */
  const { mergeVertices, mergeGroups } = await import('three/addons/utils/BufferGeometryUtils.js');
  let before = 0, after = 0;
  obj.traverse(o => { if (!o.isMesh) return; before += o.geometry.attributes.position.count;
    let g = o.geometry; g.deleteAttribute('normal'); g = mergeGroups(g); g = mergeVertices(g, 1e-4); g.computeVertexNormals(); o.geometry = g; after += g.attributes.position.count; });
  log(`vertices ${before} -> ${after}`);
  const glb = await new GLTFExporter().parseAsync(inner, { binary: true, maxTextureSize: +(P.get('maxtex') || 1024) });
  const r = await fetch('/saveglb?name=t4', { method: 'POST', body: glb }); log('export: ' + (await r.text()));
} else if (P.has('top')) {
  /* 方位問題用の上面図: 機首が北（画面の上）を向いた姿を z 軸正方向から見る */
  cam.up.set(0, 1, 0); cam.position.set(0, 0, dist); cam.lookAt(0, 0, 0);
  dl.position.set(-3, 4, 8); dl2.position.set(4, -3, 2);
  setDir(0, 0); renderer.render(scene, cam); await save('top'); log('top saved');
} else if (P.has('icon')) {
  /* アプリアイコン: 北西向きの機体を z 軸正方向（真上）から見る。画面の上が北、右が東 */
  cam.up.set(0, 1, 0); cam.position.set(0, 0, dist); cam.lookAt(0, 0, 0);
  dl.position.set(-3, 4, 8); dl2.position.set(4, -3, 2);
  setDir(315, 0); renderer.render(scene, cam); await save('icon-src'); log('icon saved');
} else if (P.has('probe')) {
  /* 試し描き: ?hd=方位 ?p=ピッチ（h はキャンバス高さに使うので別名） */
  setDir(+(P.get('hd') || 0), +(P.get('p') || 0), +(P.get('bk') || 0)); renderer.render(scene, cam); log('probe rendered');
  if (P.has('save')) await save(P.get('save'));
} else if (P.has('one')) {
  const d = DIRS.find(x => x[0] === P.get('one')); setDir(d[1], d[2]); renderer.render(scene, cam); log('rendered ' + d[0]);
} else if (P.has('banks')) {
  /* バンク付きの一括描画: ?banks=30,60 で、真上・真下を除く 12 方向 × 左右 × 各角度を bi-<方向>-r30 / -l30 … として保存。bank 0 の 14 方向も同時に描き直す（切り出し枠を共通にするため） */
  const banks = P.get('banks').split(',').map(Number).filter(Boolean);
  for (const [n, h, p] of DIRS) { setDir(h, p); renderer.render(scene, cam); await save(n); }
  for (const [n, h, p] of DIRS) {
    if (n === 'up' || n === 'down') continue;
    for (const b of banks) {
      setDir(h, p, b); renderer.render(scene, cam); await save(`${n}-r${b}`);
      setDir(h, p, -b); renderer.render(scene, cam); await save(`${n}-l${b}`);
    }
  }
  log('ALL DONE');
} else {
  for (const [n, h, p] of DIRS) { setDir(h, p); renderer.render(scene, cam); await save(n); }
  log('ALL DONE');
}
window.__done = true;
</script>
</body>
</html>
