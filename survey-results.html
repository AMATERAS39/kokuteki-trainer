<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>受験者アンケートの集計｜TENRYU</title>
<link rel="icon" href="/favicon.ico" sizes="48x48 96x96">
<style>
/* 受験者アンケート（/survey）の回答を、合言葉を入れて集計して見るページ（作成者用。2026-09-16）。
   回答は匿名（名前・メール・端末識別子・IP は保存していない）。合言葉は平均回答時間と同じ。ここには書かない */
:root{--bg:#0b1017;--panel:#0f1620;--line:rgba(255,255,255,.08);--line2:rgba(255,255,255,.16);--text:#e8eef5;--muted:#93a3b5;--accent:#5ad1e6;--amber:#e8b24a;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;--small:.875rem;--tiny:.75rem;--pad:clamp(1rem,4vw,1.5rem);--wrap:44rem}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:"Zen Kaku Gothic New","Noto Sans JP",system-ui,sans-serif;line-height:1.75;word-break:auto-phrase;padding:0 var(--pad) 3rem}
.nw{white-space:nowrap}
header{max-width:var(--wrap);margin:0 auto;padding:1rem 0;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:1rem}
.brand{font-family:var(--mono);font-weight:600;letter-spacing:.18em;color:var(--text);text-decoration:none}
.back{margin-left:auto;font-size:var(--small);color:var(--muted);text-decoration:none}
main{max-width:var(--wrap);margin:0 auto}
h1{font-size:1.375rem;margin:1.5rem 0 .5rem}
h2{font-size:1rem;margin:1.5rem 0 .5rem;color:var(--accent)}
p{margin:.5rem 0;color:var(--muted);font-size:var(--small)}
.keyrow{display:flex;gap:.5rem;flex-wrap:wrap;margin:1rem 0}
input[type=password]{flex:1 1 14rem;min-width:0;font:inherit;padding:.6rem .8rem;border-radius:.6rem;border:1px solid var(--line2);background:var(--panel);color:var(--text)}
button{font:inherit;font-weight:700;padding:.6rem 1.1rem;border-radius:.6rem;border:1px solid var(--accent);background:var(--accent);color:#06232b;cursor:pointer}
button.ghost{background:transparent;color:var(--accent)}
.tbl{border:1px solid var(--line);border-radius:.75rem;overflow:hidden;margin:.5rem 0 1rem}
.tr{display:grid;grid-template-columns:1fr auto;gap:1rem;padding:.5rem .9rem;border-top:1px solid var(--line);font-size:var(--small)}
.tr:first-child{border-top:0}
.num{font-family:var(--mono);font-weight:600;white-space:nowrap}
.free{border-left:.1875rem solid var(--amber);padding:.25rem 0 .25rem .8rem;margin:.6rem 0;font-size:var(--small);white-space:pre-wrap}
.free .m{font-family:var(--mono);font-size:var(--tiny);color:var(--muted);display:block}
.status{font-size:var(--small);color:var(--muted);min-height:1.5rem}
.sum{font-family:var(--mono);font-size:var(--small);color:var(--muted)}
</style>
</head>
<body>
<header><a class="brand" href="/">TENRYU</a><a class="back" href="/">案内ページへ戻る</a></header>
<main>
  <h1>受験者アンケートの集計</h1>
  <p>作成者用のページです。合言葉（平均回答時間と同じもの）を入れると、サイトにたまっている回答を集計して出します。回答は匿名で、名前・メール・端末の識別子・IP は含まれません。</p>
  <div class="keyrow"><input type="password" id="key" placeholder="合言葉" autocomplete="off"><button id="go">集計する</button><button class="ghost" id="dl" hidden>JSON を保存</button></div>
  <p id="remember" hidden>合言葉はこの端末に覚えました。次からは開くだけで集計が出ます。<a href="#" id="forget">この端末から消す</a></p>
  <div class="status" id="st"></div>
  <div id="out"></div>
</main>
<script>
(function(){
  const $=s=>document.querySelector(s);
  const NAMES={"date": "試験日程", "help_heading": "方位判読：本番の役に立ったか", "help_attitude": "姿勢判読：本番の役に立ったか", "help_combo": "方位×姿勢指示器：本番の役に立ったか", "help_control": "操縦操作：本番の役に立ったか", "result": "本番の手応え（この 4 種目の全体）", "timeoutIn": "時間切れがあった種目", "difficulty3": "本番とアプリ（Hard・Max）の難しさ", "missing": "アプリになかったもの・違っていたもの", "startWhen": "使い始めた時期", "hours": "合計の使用時間", "mostUsed": "いちばん使った種目", "level": "到達した難易度", "edition": "使った版", "source": "知ったきっかけ", "searchWords": "検索した言葉", "price": "価格の受け止め", "target": "志望", "status": "区分", "attempts": "受験回数", "other": "他に使った対策", "sex": "身体的性別", "trouble": "他に困ったこと（他の検査区分・二次試験など）", "wants": "来年度の受験者のために欲しい機能", "impression": "アプリの感想", "seen_heading": "（v2）seen_heading", "cnt_heading": "（v2）cnt_heading", "time_heading": "（v2）time_heading", "seen_attitude": "（v2）seen_attitude", "cnt_attitude": "（v2）cnt_attitude", "time_attitude": "（v2）time_attitude", "seen_combo": "（v2）seen_combo", "cnt_combo": "（v2）cnt_combo", "time_combo": "（v2）time_combo", "seen_control": "（v2）seen_control", "cnt_control": "（v2）cnt_control", "time_control": "（v2）time_control", "markNotN": "（v2）markNotN", "oblique": "（v2）oblique", "vertical": "（v2）vertical", "bankOther": "（v2）bankOther", "diag": "（v2）diag", "throttle": "（v2）throttle", "initTilt": "（v2）initTilt", "imgStyle": "（v2）imgStyle", "timeout": "（v2）timeout", "ops": "（v2）ops", "sections": "（v2）sections"};
  const LABELS={"date": {"0919": "9 月 19 日", "0926": "9 月 26 日", "none": "受けていない"}, "help_heading": {"yes": "役に立った", "some": "少し役に立った", "no": "役に立たなかった", "na": "本番に出なかった・分からない"}, "help_attitude": {"yes": "役に立った", "some": "少し役に立った", "no": "役に立たなかった", "na": "本番に出なかった・分からない"}, "help_combo": {"yes": "役に立った", "some": "少し役に立った", "no": "役に立たなかった", "na": "本番に出なかった・分からない"}, "help_control": {"yes": "役に立った", "some": "少し役に立った", "no": "役に立たなかった", "na": "本番に出なかった・分からない"}, "result": {"mostly": "ほぼできた", "half": "半分くらい", "little": "あまりできなかった", "unk": "分からない"}, "timeoutIn": {"heading": "方位判読", "attitude": "姿勢判読", "combo": "方位×姿勢指示器", "control": "操縦操作", "other": "アプリにない種目", "none": "なかった"}, "difficulty3": {"harder": "本番のほうが難しい", "same": "同じくらい", "easier": "本番のほうが易しい", "unk": "分からない"}, "startWhen": {"w1": "1 週間前から", "w2_4": "2〜4 週間前から", "m1_2": "1〜2 か月前から", "m3p": "それより前から"}, "hours": {"h1": "1 時間未満", "h3": "1〜3 時間", "h10": "3〜10 時間", "h10p": "10 時間以上"}, "mostUsed": {"heading": "方位判読", "attitude": "姿勢判読", "combo": "方位×姿勢指示器", "control": "操縦操作", "sim": "3D シミュレーター"}, "level": {"easy": "Easy", "normal": "Normal", "hard": "Hard", "max": "Max"}, "edition": {"trial": "体験版だけ", "ios": "完全版（iPhone・iPad）", "android": "完全版（Android）"}, "source": {"search": "検索", "sns": "SNS・動画", "friend": "知人", "school": "学校・予備校", "ai": "AI の回答", "other": "その他"}, "price": {"cheap": "安い", "fair": "妥当", "worth": "高いが払う価値はあった", "high": "高い", "notbought": "買っていない"}, "target": {"jasdf": "航空自衛隊", "jmsdf": "海上自衛隊", "both": "両方"}, "status": {"hs": "高校在学", "grad": "高校既卒", "univ": "大学・専門在学", "work": "社会人", "other": "その他"}, "attempts": {"first": "初めて", "again": "2 回目以上"}, "other": {"pastq": "過去問集・問題集", "prep": "予備校・塾", "web": "ネットの情報", "none": "特になし"}, "sex": {"m": "男性", "f": "女性", "na": "答えない"}, "seen_heading": {"yes": "yes", "no": "no", "unk": "unk"}, "cnt_heading": {"c10": "c10", "c20": "c20", "c30": "c30", "c31": "c31", "unk": "unk"}, "time_heading": {"spare": "spare", "just": "just", "short": "short", "unk": "unk"}, "seen_attitude": {"yes": "yes", "no": "no", "unk": "unk"}, "cnt_attitude": {"c10": "c10", "c20": "c20", "c30": "c30", "c31": "c31", "unk": "unk"}, "time_attitude": {"spare": "spare", "just": "just", "short": "short", "unk": "unk"}, "seen_combo": {"yes": "yes", "no": "no", "unk": "unk"}, "cnt_combo": {"c10": "c10", "c20": "c20", "c30": "c30", "c31": "c31", "unk": "unk"}, "time_combo": {"spare": "spare", "just": "just", "short": "short", "unk": "unk"}, "seen_control": {"yes": "yes", "no": "no", "unk": "unk"}, "cnt_control": {"c10": "c10", "c20": "c20", "c30": "c30", "c31": "c31", "unk": "unk"}, "time_control": {"spare": "spare", "just": "just", "short": "short", "unk": "unk"}, "markNotN": {"yes": "yes", "no": "no", "unk": "unk"}, "oblique": {"yes": "yes", "no": "no", "unk": "unk"}, "vertical": {"yes": "yes", "no": "no", "unk": "unk"}, "bankOther": {"yes": "yes", "no": "no", "unk": "unk"}, "diag": {"yes": "yes", "no": "no", "unk": "unk"}, "throttle": {"yes": "yes", "no": "no", "unk": "unk"}, "initTilt": {"yes": "yes", "no": "no", "unk": "unk"}, "imgStyle": {"photo": "photo", "cg": "cg", "mono": "mono", "unk": "unk"}, "timeout": {"yes": "yes", "no": "no", "unk": "unk"}, "ops": {"one": "one", "two_simul": "two_simul", "two_seq": "two_seq", "three": "three"}, "sections": {"A": "A", "B": "B", "C": "C", "D": "D", "E": "E", "second": "second", "none": "none"}};
  const ONE=["date", "help_heading", "help_attitude", "help_combo", "help_control", "result", "difficulty3", "startWhen", "hours", "mostUsed", "level", "edition", "price", "target", "status", "attempts", "sex"],MANY=["timeoutIn", "source", "other"],TEXT=["missing", "searchWords", "trouble", "wants", "impression"],V2ONE=["seen_heading", "cnt_heading", "time_heading", "seen_attitude", "cnt_attitude", "time_attitude", "seen_combo", "cnt_combo", "time_combo", "seen_control", "cnt_control", "time_control", "markNotN", "oblique", "vertical", "bankOther", "diag", "throttle", "initTilt", "imgStyle", "timeout"],V2MANY=["ops", "sections"];
  const DATE={'0919':'9 月 19 日','0926':'9 月 26 日','none':'受けていない','':'（未回答）'};
  const SEX={m:'男性',f:'女性',na:'答えない','':'（未回答）'};
  const ITEMS={heading:'方位判読',attitude:'姿勢判読',combo:'方位×姿勢指示器',ctrl1:'操縦操作 1 つ',ctrl2:'操縦操作 2 つ（同時）',ctrl2seq:'操縦操作 2 つ（順番）'};
  const DIFF={harder:'アプリより本番が難しかった',same:'同じくらい',easier:'アプリより易しかった',unknown:'分からない','':'（未回答）'};
  const esc=t=>String(t==null?'':t).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  let last=null;
  const tbl=(title,counts,names)=>`<h2>${esc(title)}</h2><div class="tbl">${Object.keys(names).map(k=>`<div class="tr"><div>${esc(names[k])}</div><div class="num">${counts[k]||0}</div></div>`).join('')}</div>`;
  function render(items){
    const c=(f)=>{const o={};for(const x of items){const v=x[f]||'';o[v]=(o[v]||0)+1}return o};
    const cl=(f)=>{const o={};for(const x of items)for(const i of (x[f]||[]))o[i]=(o[i]||0)+1;return o};
    let h=`<p class="sum">回答 ${items.length} 件（最新 ${items.length?new Date(Math.max(...items.map(x=>x.at||0))).toLocaleString('ja-JP'):'—'}）</p>`;
    const lab=(f)=>Object.assign({'':'（未回答）'},LABELS[f]||{});
    h+=`<p class="m">v3（2026-09-19 昼からの設問）${items.filter(x=>x.v===3).length} 件、v2（19 日の朝だけ）${items.filter(x=>x.v===2).length} 件、v1 ${items.filter(x=>!x.v||x.v===1).length} 件</p>`;
    for(const f of ONE)h+=tbl(NAMES[f],c(f),lab(f));
    for(const f of MANY)h+=tbl(NAMES[f]+'（選んだ人数）',cl(f),lab(f));
    if(items.some(x=>x.v===2)){for(const f of V2ONE)h+=tbl(NAMES[f],c(f),lab(f));for(const f of V2MANY)h+=tbl(NAMES[f]+'（選んだ人数）',cl(f),lab(f))}
    if(items.some(x=>!x.v||x.v===1)){h+=tbl('（v1）難易度の印象',c('difficulty'),DIFF)+tbl('（v1）出題されて、アプリにもあったもの',cl('had'),ITEMS)+tbl('（v1）アプリにあるが、出題されなかったもの',cl('notHad'),ITEMS)}
    for(const [title,f] of TEXT.map(f=>[NAMES[f],f])){
      const L=items.filter(x=>(x[f]||'').trim());
      h+=`<h2>${esc(title)}（${L.length} 件）</h2>`+(L.length?L.map(x=>`<div class="free"><span class="m">${new Date(x.at||0).toLocaleString('ja-JP')}　${esc(DATE[x.date||'']||'')}${x.code?'　#'+esc(x.code):''}</span>${esc(x[f])}</div>`).join(''):'<p>まだありません。</p>');
    }
    $('#out').innerHTML=h;
  }
  async function go(){
    const key=$('#key').value.trim();if(!key){$('#st').textContent='合言葉を入れてください。';return}
    $('#st').textContent='取ってきています…';$('#out').innerHTML='';$('#dl').hidden=true;
    try{
      const r=await fetch('/api/survey?key='+encodeURIComponent(key),{cache:'no-store'});
      if(r.status===403){$('#st').textContent='合言葉が違います。';return}
      const d=await r.json();if(!d.ok)throw 0;
      last=d;render(d.items||[]);$('#st').textContent='';$('#dl').hidden=false;
      try{localStorage.setItem('aat.surveyKey',key);$('#remember').hidden=false}catch(e){}   /* この端末に覚える（登録）。URL に ?key= を付けて開いても同じ */
    }catch(e){$('#st').textContent='取れませんでした。時間をおいてもう一度お試しください。'}
  }
  $('#go').addEventListener('click',go);
  $('#key').addEventListener('keydown',e=>{if(e.key==='Enter')go()});
  $('#dl').addEventListener('click',()=>{if(!last)return;const b=new Blob([JSON.stringify(last,null,1)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='survey-'+new Date().toISOString().slice(0,10)+'.json';a.click()});
  $('#forget').addEventListener('click',e=>{e.preventDefault();try{localStorage.removeItem('aat.surveyKey')}catch(x){}$('#key').value='';$('#remember').hidden=true;$('#out').innerHTML='';$('#dl').hidden=true;$('#st').textContent='この端末から消しました。'});
  /* 登録: URL の ?key=合言葉 で開くと、その合言葉をこの端末に覚えて、URL からは消す（履歴やブックマークに残さない）。以後は開くだけで集計 */
  try{const u=new URL(location.href),qk=u.searchParams.get('key');if(qk){localStorage.setItem('aat.surveyKey',qk);u.searchParams.delete('key');history.replaceState(null,'',u.pathname)}}catch(e){}
  try{const k=localStorage.getItem('aat.surveyKey');if(k){$('#key').value=k;go()}}catch(e){}
})();
</script>
</body>
</html>
